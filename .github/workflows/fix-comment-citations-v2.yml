name: Fix comment citations v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-comment-citations-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch comment PMID handling and citation merging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('pmid_docx_to_zotero.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('def comment_records(')
          end = text.index('\ndef insert_before', start)
          new_comment_records = textwrap.dedent(r'''
          def comment_visible_text(body):
              """Extract comment text without concatenating separate Word paragraphs."""
              paragraphs = []
              for pm in PARA_RE.finditer(body):
                  value = visible_text(pm.group(0)).strip()
                  if value:
                      paragraphs.append(value)
              if paragraphs:
                  return "\n".join(paragraphs)
              return visible_text(body)


          def comment_records(comments_xml, comments_extended_xml):
              parent_by_para = {}
              for m in re.finditer(r'<w15:commentEx\b[^>]*\bw15:paraId="([0-9A-Fa-f]{8})"[^>]*>', comments_extended_xml):
                  tag = m.group(0)
                  p = re.search(r'\bw15:paraIdParent="([0-9A-Fa-f]{8})"', tag)
                  parent_by_para[m.group(1).upper()] = p.group(1).upper() if p else None
              records = []
              for m in COMMENT_RE.finditer(comments_xml):
                  body = m.group("body")
                  para_ids = re.findall(r'\bw14:paraId="([0-9A-Fa-f]{8})"', body)
                  if not para_ids:
                      continue
                  last_para = para_ids[-1].upper()
                  records.append({
                      "id": int(m.group("id")),
                      "text": comment_visible_text(body),
                      "last_para": last_para,
                      "is_reply": bool(parent_by_para.get(last_para)),
                  })
              return records
          ''').lstrip()
          text = text[:start] + new_comment_records + text[end:]

          start = text.index('def append_refs_at_comment_anchor(')
          end = text.index('\ndef add_comment_citations_and_replies', start)
          new_append = textwrap.dedent(r'''
          _CITATION_INSTR_RE = re.compile(
              r'(<w:instrText\b[^>]*>\s*ADDIN ZOTERO_ITEM CSL_CITATION\s+)'
              r'(?P<payload>[\s\S]*?)'
              r'(\s*</w:instrText>)'
          )
          _FIELD_BEGIN_RE = re.compile(r'<w:fldChar\b[^>]*\bw:fldCharType="begin"[^>]*/?>')
          _FIELD_END_RE = re.compile(r'<w:fldChar\b[^>]*\bw:fldCharType="end"[^>]*/?>')


          def _zotero_citation_fields(document_xml):
              fields = []
              for instr in _CITATION_INSTR_RE.finditer(document_xml):
                  begin = None
                  for candidate in _FIELD_BEGIN_RE.finditer(document_xml, 0, instr.start()):
                      begin = candidate
                  if begin is None:
                      continue
                  if _FIELD_END_RE.search(document_xml, begin.end(), instr.start()) is not None:
                      continue
                  end = _FIELD_END_RE.search(document_xml, instr.end())
                  if end is None:
                      continue
                  fields.append({
                      "start": begin.start(),
                      "end": end.end(),
                      "payload_start": instr.start("payload"),
                      "payload_end": instr.end("payload"),
                  })
              return fields


          def _comment_paragraph_bounds(document_xml, start_pos, end_pos):
              para_start = 0
              for pm in re.finditer(r'<w:p\b[^>]*>', document_xml[:start_pos]):
                  para_start = pm.start()
              close = document_xml.find('</w:p>', end_pos)
              para_end = len(document_xml) if close < 0 else close + len('</w:p>')
              return para_start, para_end


          def _field_for_comment_anchor(document_xml, range_start, range_end):
              fields = _zotero_citation_fields(document_xml)
              if not fields:
                  return None

              overlapping = [
                  field for field in fields
                  if field["start"] < range_end and field["end"] > range_start
              ]
              if overlapping:
                  return min(
                      overlapping,
                      key=lambda field: abs(field["start"] - range_start) + abs(field["end"] - range_end),
                  )

              para_start, para_end = _comment_paragraph_bounds(document_xml, range_start, range_end)
              candidates = []
              for field in fields:
                  if field["start"] < para_start or field["end"] > para_end:
                      continue
                  if field["end"] <= range_start:
                      gap = document_xml[field["end"]:range_start]
                      distance = range_start - field["end"]
                  elif field["start"] >= range_end:
                      gap = document_xml[range_end:field["start"]]
                      distance = field["start"] - range_end
                  else:
                      continue
                  if re.search(r'[A-Za-z0-9_]', visible_text(gap)):
                      continue
                  candidates.append((distance, field))
              if not candidates:
                  return None
              candidates.sort(key=lambda item: item[0])
              return candidates[0][1]


          def _merge_refs_into_citation_field(document_xml, field, refs):
              raw_payload = html.unescape(
                  document_xml[field["payload_start"]:field["payload_end"]]
              ).strip()
              try:
                  citation_data = json.loads(raw_payload)
              except Exception:
                  return document_xml, 0

              citation_items = citation_data.get("citationItems")
              if not isinstance(citation_items, list):
                  return document_xml, 0

              existing_blob = json.dumps(citation_items, ensure_ascii=False)
              added = 0
              for ref in refs:
                  if ref.uri in existing_blob or ref.key in existing_blob:
                      continue
                  citation_items.append({"uris": [ref.uri]})
                  existing_blob += ref.uri + ref.key
                  added += 1

              if not added:
                  return document_xml, 0

              new_payload = escape_xml_text(
                  json.dumps(citation_data, ensure_ascii=False, separators=(",", ":"))
              )
              document_xml = (
                  document_xml[:field["payload_start"]]
                  + new_payload
                  + document_xml[field["payload_end"]:]
              )
              return document_xml, added


          def append_refs_at_comment_anchor(document_xml, comment_id, refs):
              """Add comment-requested refs, merging them into the citation the comment targets."""
              cid = str(comment_id)
              start_re = re.compile(r'<w:commentRangeStart\b[^>]*\bw:id="' + re.escape(cid) + r'"[^>]*/>')
              end_re = re.compile(r'<w:commentRangeEnd\b[^>]*\bw:id="' + re.escape(cid) + r'"[^>]*/>')

              sm = start_re.search(document_xml)
              if not sm:
                  return document_xml, 0
              em = end_re.search(document_xml, sm.end())
              if not em:
                  return document_xml, 0

              anchored_xml = document_xml[sm.end():em.start()]
              refs_to_add = []
              for ref in refs:
                  if ref.uri in anchored_xml or ref.key in anchored_xml:
                      continue
                  if all(x.key != ref.key for x in refs_to_add):
                      refs_to_add.append(ref)
              if not refs_to_add:
                  return document_xml, 0

              field = _field_for_comment_anchor(document_xml, sm.end(), em.start())
              if field is not None:
                  merged_xml, merged_count = _merge_refs_into_citation_field(
                      document_xml, field, refs_to_add
                  )
                  if merged_count:
                      return merged_xml, merged_count

              preceding_text = list(WT_RE.finditer(document_xml, 0, em.start()))
              run_properties = (
                  _run_properties_for_text_match(document_xml, preceding_text[-1])
                  if preceding_text else ""
              )
              payload = (
                  _styled_word_run('<w:t xml:space="preserve"> </w:t>', run_properties)
                  + build_word_field_xml(refs_to_add, run_properties)
              )
              document_xml = document_xml[:em.start()] + payload + document_xml[em.start():]
              return document_xml, len(refs_to_add)
          ''').lstrip()
          text = text[:start] + new_append + text[end:]

          fn_start = text.index('def all_identifiers_in_docx(')
          fn_end = text.index('\ndef docx_has_zotero_preferences', fn_start)
          fn = text[fn_start:fn_end]
          old_call = 'collect_from_text(visible_text(cm.group("body")))'
          new_call = 'collect_from_text(comment_visible_text(cm.group("body")))'
          if old_call not in fn:
              raise SystemExit('Could not find comment identifier call')
          fn = fn.replace(old_call, new_call, 1)
          text = text[:fn_start] + fn + text[fn_end:]

          path.write_text(text, encoding='utf-8')

          root = Path('.bootstrap')
          for part in root.glob('core.part*'):
              part.unlink()
          chunk = 9000
          for i in range(0, len(text), chunk):
              (root / 'core.part{:02d}'.format(i // chunk)).write_text(text[i:i + chunk], encoding='utf-8')

          build = Path('.github/workflows/build-windows.yml')
          b = build.read_text(encoding='utf-8')
          b = b.replace('v1.0.3', 'v1.0.4')
          b = b.replace(
              "Inserted Zotero citations now inherit the surrounding document formatting, using the preceding text run as the default instead of Word's default font and size.",
              "Fixes PMID and DOI references listed on separate lines in Word comments and merges comment-requested references into the Zotero citation the comment is attached to."
          )
          build.write_text(b, encoding='utf-8')
          PY

      - name: Verify comment handling
        shell: bash
        run: |
          python -m py_compile pmid_docx_to_zotero.py gui.py
          python - <<'PY'
          import html
          import tempfile
          import zipfile
          from pathlib import Path
          import pmid_docx_to_zotero as m

          comments = '''<w:comments><w:comment w:id="1">
          <w:p w14:paraId="00000001"><w:r><w:t>12402102</w:t></w:r></w:p>
          <w:p w14:paraId="00000002"><w:r><w:t>23685858</w:t></w:r></w:p>
          <w:p w14:paraId="00000003"><w:r><w:t>29479311</w:t></w:r></w:p>
          </w:comment></w:comments>'''
          recs = m.comment_records(comments, '')
          assert recs[0]['text'] == '12402102\n23685858\n29479311', recs
          ids = [v for _, _, k, v in m.identifiers_in_text(recs[0]['text']) if k == 'pmid']
          assert ids == ['12402102', '23685858', '29479311'], ids

          with tempfile.TemporaryDirectory() as td:
              p = Path(td) / 'x.docx'
              with zipfile.ZipFile(p, 'w') as z:
                  z.writestr('word/document.xml', '<w:document><w:body/></w:document>')
                  z.writestr('word/comments.xml', comments)
              pmids, _ = m.all_identifiers_in_docx(p)
              assert pmids == {'12402102', '23685858', '29479311'}, pmids

          existing = m.ZoteroRef('REF00090', 'Existing (2020)', 'Existing', 'http://zotero.org/users/1/items/REF00090')
          extras = [
              m.ZoteroRef('AAA00001', 'A (2001)', 'A', 'http://zotero.org/users/1/items/AAA00001'),
              m.ZoteroRef('BBB00002', 'B (2002)', 'B', 'http://zotero.org/users/1/items/BBB00002'),
              m.ZoteroRef('CCC00003', 'C (2003)', 'C', 'http://zotero.org/users/1/items/CCC00003'),
          ]
          field = m.build_word_field_xml([existing])
          doc = '<w:document><w:body><w:p><w:commentRangeStart w:id="1"/>' + field + '<w:commentRangeEnd w:id="1"/></w:p></w:body></w:document>'
          out, added = m.append_refs_at_comment_anchor(doc, 1, extras)
          assert added == 3, added
          assert out.count('ADDIN ZOTERO_ITEM CSL_CITATION') == 1, out
          decoded = html.unescape(out)
          for ref in [existing] + extras:
              assert ref.uri in decoded, ref.uri

          doc2 = '<w:document><w:body><w:p>' + field + '<w:commentRangeStart w:id="2"/><w:r><w:t>.</w:t></w:r><w:commentRangeEnd w:id="2"/></w:p></w:body></w:document>'
          out2, added2 = m.append_refs_at_comment_anchor(doc2, 2, extras)
          assert added2 == 3, added2
          assert out2.count('ADDIN ZOTERO_ITEM CSL_CITATION') == 1, out2
          print('Comment citation tests passed')
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-comment-citations.yml
          rm -f .github/workflows/fix-comment-citations-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix comment reference insertion"
          git push
