name: Apply citation formatting fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-citation-formatting-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch citation formatting inheritance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pmid_docx_to_zotero.py')
          text = path.read_text(encoding='utf-8')

          old = '''def build_word_field_xml(refs):
              citation_data, display = build_citation_data(refs)
              json_text = json.dumps(citation_data, ensure_ascii=False, separators=(",", ":"))
              escaped_json = escape_xml_text(json_text)
              escaped_display = escape_xml_text(display)
              return (
                  '<w:r><w:fldChar w:fldCharType="begin"/></w:r>'
                  '<w:r><w:instrText xml:space="preserve"> ADDIN ZOTERO_ITEM CSL_CITATION {} </w:instrText></w:r>'
                  '<w:r><w:fldChar w:fldCharType="separate"/></w:r>'
                  '<w:r><w:t>{}</w:t></w:r>'
                  '<w:r><w:fldChar w:fldCharType="end"/></w:r>'
              ).format(escaped_json, escaped_display)


          def build_inline_field_insertion(refs):
              # This intentionally mirrors the current ODF/DOCX Scan implementation:
              # close the current Word text run, insert a complete Word field, then reopen
              # a text run for whatever ordinary text follows.
              return '</w:t></w:r>' + build_word_field_xml(refs) + '<w:r><w:t xml:space="preserve">'
          '''.replace('          ', '')

          new = '''def _run_properties_for_text_match(xml, match):
              """Return the direct Word run formatting that owns one <w:t> match."""
              prefix = xml[:match.start()]
              run_starts = list(re.finditer(r'<w:r\\b[^>]*>', prefix))
              if not run_starts:
                  return ""
              run_start = run_starts[-1].start()
              if prefix.rfind("</w:r>") > run_start:
                  return ""
              run_prefix = xml[run_start:match.start()]
              prop_match = re.search(
                  r'(<w:rPr\\b[^>]*/>|<w:rPr\\b[^>]*>[\\s\\S]*?</w:rPr>)',
                  run_prefix,
              )
              return prop_match.group(1) if prop_match else ""


          def _styled_word_run(inner_xml, run_properties=""):
              return '<w:r>{}{}</w:r>'.format(run_properties or "", inner_xml)


          def build_word_field_xml(refs, run_properties=""):
              citation_data, display = build_citation_data(refs)
              json_text = json.dumps(citation_data, ensure_ascii=False, separators=(",", ":"))
              escaped_json = escape_xml_text(json_text)
              escaped_display = escape_xml_text(display)
              return (
                  _styled_word_run('<w:fldChar w:fldCharType="begin"/>', run_properties)
                  + _styled_word_run(
                      '<w:instrText xml:space="preserve"> ADDIN ZOTERO_ITEM CSL_CITATION {} </w:instrText>'.format(escaped_json),
                      run_properties,
                  )
                  + _styled_word_run('<w:fldChar w:fldCharType="separate"/>', run_properties)
                  + _styled_word_run('<w:t>{}</w:t>'.format(escaped_display), run_properties)
                  + _styled_word_run('<w:fldChar w:fldCharType="end"/>', run_properties)
              )


          def build_inline_field_insertion(refs, run_properties=""):
              # Close the current Word text run, insert the Zotero field, then reopen
              # ordinary text with the same formatting so insertion does not reset it.
              return (
                  '</w:t></w:r>'
                  + build_word_field_xml(refs, run_properties)
                  + '<w:r>{}<w:t xml:space="preserve">'.format(run_properties or "")
              )
          '''.replace('          ', '')

          if old not in text:
              raise SystemExit('Could not find build_word_field_xml block to patch')
          text = text.replace(old, new, 1)

          old = '''    texts = [html.unescape(m.group(2)) for m in matches]
              intervals = []
              cursor = 0
              for i, text in enumerate(texts):
                  intervals.append((i, cursor, cursor + len(text)))
                  cursor += len(text)

              token_fields = {}
              # Work right-to-left so offsets calculated from the original text remain valid.
              for repl in reversed(replacements):
                  affected = [(i, s, e) for i, s, e in intervals if repl.start < e and repl.end > s]
                  if not affected:
                      continue
                  token = "ZOTEROFIELD_{}_{}".format(generate_citation_id(), len(token_fields))
                  token_fields[token] = build_inline_field_insertion(repl.refs)
                  fi, fs, _ = affected[0]
                  li, ls, _ = affected[-1]
          '''.replace('              ', '')

          new = '''    texts = [html.unescape(m.group(2)) for m in matches]
              run_properties = [_run_properties_for_text_match(paragraph_xml, m) for m in matches]
              intervals = []
              cursor = 0
              for i, text in enumerate(texts):
                  intervals.append((i, cursor, cursor + len(text)))
                  cursor += len(text)

              token_fields = {}
              # Work right-to-left so offsets calculated from the original text remain valid.
              for repl in reversed(replacements):
                  affected = [(i, s, e) for i, s, e in intervals if repl.start < e and repl.end > s]
                  if not affected:
                      continue
                  fi, fs, _ = affected[0]
                  li, ls, _ = affected[-1]

                  # Prefer the text immediately before the citation, as Word users expect
                  # inserted citations to match the surrounding manuscript. At the start of
                  # a paragraph, fall back to the run that contained the identifier itself.
                  style_index = fi
                  if repl.start > 0:
                      prior_pos = repl.start - 1
                      for idx, start, end in intervals:
                          if start <= prior_pos < end:
                              style_index = idx
                              break
                  style_xml = run_properties[style_index] if style_index < len(run_properties) else ""

                  token = "ZOTEROFIELD_{}_{}".format(generate_citation_id(), len(token_fields))
                  token_fields[token] = build_inline_field_insertion(repl.refs, style_xml)
          '''.replace('              ', '')

          if old not in text:
              raise SystemExit('Could not find patch_paragraph block to patch')
          text = text.replace(old, new, 1)

          old = '''    payload = '<w:r><w:t xml:space="preserve"> </w:t></w:r>' + build_word_field_xml(refs_to_add)
          '''.replace('          ', '')
          new = '''    preceding_text = list(WT_RE.finditer(document_xml, 0, em.start()))
              run_properties = (
                  _run_properties_for_text_match(document_xml, preceding_text[-1])
                  if preceding_text else ""
              )
              payload = (
                  _styled_word_run('<w:t xml:space="preserve"> </w:t>', run_properties)
                  + build_word_field_xml(refs_to_add, run_properties)
              )
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('Could not find comment citation payload to patch')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          # Keep the connector-friendly bootstrap fragments synchronized with the real source.
          root = Path('.bootstrap')
          for part in root.glob('core.part*'):
              part.unlink()
          chunk = 9000
          for i in range(0, len(text), chunk):
              (root / 'core.part{:02d}'.format(i // chunk)).write_text(text[i:i + chunk], encoding='utf-8')
          PY

      - name: Verify formatting inheritance
        run: |
          python -m py_compile pmid_docx_to_zotero.py
          python - <<'PY'
          import pmid_docx_to_zotero as m

          rpr = '<w:rPr><w:rFonts w:ascii="Times New Roman"/><w:sz w:val="22"/></w:rPr>'
          para = '<w:p><w:r>{}<w:t>Text before (123456) after</w:t></w:r></w:p>'.format(rpr)
          ref = m.ZoteroRef('ABCDEFGH', 'Smith (2020)', 'Example', 'http://zotero.org/users/1/items/ABCDEFGH')
          start = len('Text before ')
          repl = m.Replacement(start, start + len('(123456)'), [ref], ['123456'])
          out = m.patch_paragraph(para, [repl])
          assert 'ADDIN ZOTERO_ITEM CSL_CITATION' in out
          assert out.count(rpr) >= 3, out
          assert '<w:r>{}<w:t xml:space="preserve"> after'.format(rpr) in out, out
          print('Formatting inheritance test passed')
          PY

      - name: Commit fix
        run: |
          rm .github/workflows/apply-citation-formatting-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve citation font and text formatting"
          git push
