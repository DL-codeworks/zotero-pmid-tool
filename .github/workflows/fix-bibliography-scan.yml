name: Harden bibliography scanning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-bibliography-scan.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harden bibliography detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pmid_docx_to_zotero.py')
          s = p.read_text(encoding='utf-8')

          old = '        if "ADDIN ZOTERO_BIBL" not in code or "CSL_BIBLIOGRAPHY" not in code:\n            continue\n'
          new = (
              '        if "CSL_BIBLIOGRAPHY" not in code:\n'
              '            continue\n'
              '        # Zotero Word XML uses ZOTERO_BIBL; Zotero\'s integration layer\n'
              '        # represents the same field internally as BIBL ... CSL_BIBLIOGRAPHY.\n'
              '        if "ZOTERO_BIBL" not in code and not re.search(r"(?:^|\\s)BIBL(?:\\s|$)", code):\n'
              '            continue\n'
          )
          if old not in s:
              raise SystemExit('bibliography code condition not found')
          s = s.replace(old, new, 1)

          old = (
              '    # Plain-text bibliographies have no Zotero field. If neither official\n'
              '    # Zotero marker nor Word\'s Bibliography style exists, use the last\n'
              '    # conventional standalone heading (last avoids a TOC entry).\n'
              '    if not field_spans and not style_spans:\n'
          )
          new = (
              '    # Plain-text bibliographies have no Zotero field. When there is no\n'
              '    # Zotero field, use the last conventional standalone heading as a\n'
              '    # section boundary as well (last avoids a TOC entry).\n'
              '    if not field_spans:\n'
          )
          if old not in s:
              raise SystemExit('heading fallback block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          python -m py_compile pmid_docx_to_zotero.py gui.py
          python - <<'PY'
          import pmid_docx_to_zotero as m
          for code in (
              ' ADDIN ZOTERO_BIBL {"uncited":[]} CSL_BIBLIOGRAPHY ',
              ' BIBL {"uncited":[]} CSL_BIBLIOGRAPHY ',
          ):
              doc = '<w:p><w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText>' + code + '</w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>PMID: 12402102</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p>'
              assert m._zotero_bibliography_field_spans(doc), code
          manual = '<w:document><w:body><w:p><w:r><w:t>References</w:t></w:r></w:p><w:p><w:pPr><w:pStyle w:val="Bibliography"/></w:pPr><w:r><w:t>PMID: 12402102</w:t></w:r></w:p><w:p><w:r><w:t>PMID: 23685858</w:t></w:r></w:p></w:body></w:document>'
          spans = m._bibliography_exclusion_spans(manual)
          assert spans and spans[0][0] < manual.index('12402102') and spans[0][1] == len(manual)
          print('bibliography detection hardening passed')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pmid_docx_to_zotero.py
          git commit -m "Harden Zotero bibliography detection"
          git push
