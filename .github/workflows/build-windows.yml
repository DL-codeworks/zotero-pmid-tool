name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "build_exe.bat"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "*.py"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax and entrypoint check
        run: |
          python -m py_compile pmid_docx_to_zotero.py gui.py
          python -c "import pmid_docx_to_zotero as m; assert callable(getattr(m, 'main', None)), 'pmid_docx_to_zotero.main() is missing'; import gui; assert callable(getattr(gui, 'main', None)), 'gui.main() is missing'"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZoteroPMIDTool gui.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ZoteroPMIDTool-windows
          path: dist/ZoteroPMIDTool.exe
          if-no-files-found: error

      - name: Publish Windows release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.2 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.2 dist/ZoteroPMIDTool.exe --title "Zotero PMID Tool v1.0.2" --notes "Makes inserted Zotero citations inherit the formatting of the preceding document text instead of falling back to Word's default font and size."
          }
