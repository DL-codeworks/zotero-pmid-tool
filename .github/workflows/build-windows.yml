name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "build_exe.bat"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "*.py"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax and entrypoint check
        run: |
          python -m py_compile pmid_docx_to_zotero.py gui.py
          python -c "import pmid_docx_to_zotero as m; assert callable(getattr(m, 'main', None)), 'pmid_docx_to_zotero.main() is missing'; import gui; assert callable(getattr(gui, 'main', None)), 'gui.main() is missing'"

      - name: Comment citation regression check
        shell: pwsh
        run: |
          @'
          import html
          import pmid_docx_to_zotero as m

          comments = '<w:comments><w:comment w:id="1"><w:p w14:paraId="00000001"><w:r><w:t>12402102</w:t></w:r></w:p><w:p w14:paraId="00000002"><w:r><w:t>23685858</w:t></w:r></w:p><w:p w14:paraId="00000003"><w:r><w:t>29479311</w:t></w:r></w:p></w:comment></w:comments>'
          recs = m.comment_records(comments, '')
          assert recs[0]['text'] == '12402102\n23685858\n29479311'

          existing = m.ZoteroRef('REF00090', 'Existing (2020)', 'Existing', 'http://zotero.org/users/1/items/REF00090')
          extras = [
              m.ZoteroRef('AAA00001', 'A (2001)', 'A', 'http://zotero.org/users/1/items/AAA00001'),
              m.ZoteroRef('BBB00002', 'B (2002)', 'B', 'http://zotero.org/users/1/items/BBB00002'),
              m.ZoteroRef('CCC00003', 'C (2003)', 'C', 'http://zotero.org/users/1/items/CCC00003'),
          ]
          field = m.build_word_field_xml([existing])
          doc = '<w:document><w:body><w:p><w:commentRangeStart w:id="1"/>' + field + '<w:commentRangeEnd w:id="1"/></w:p></w:body></w:document>'
          out, added = m.append_refs_at_comment_anchor(doc, 1, extras)
          assert added == 3
          assert out.count('ADDIN ZOTERO_ITEM CSL_CITATION') == 1
          decoded = html.unescape(out)
          for ref in [existing] + extras:
              assert ref.uri in decoded
          '@ | python -

      - name: PMID syntax regression check
        shell: pwsh
        run: |
          @'
          import pmid_docx_to_zotero as m

          a = m.ZoteroRef('AAAA1111', 'A (2020)', 'A', 'http://zotero.org/users/1/items/AAAA1111')
          b = m.ZoteroRef('BBBB2222', 'B (2021)', 'B', 'http://zotero.org/users/1/items/BBBB2222')
          pmids = {'23731077': a, '12402102': b}

          one = [
              '23731077', '(23731077)', '[23731077]', '{23731077}',
              '(23731077]', '[23731077)', '{23731077]',
              'PMID: 23731077', 'PMID 23731077', 'PMIDs: 23731077',
              'PubMed ID: 23731077', '[PMID: 23731077]'
          ]
          for sample in one:
              reps, mp, md, manual = m.find_replacements(sample, pmids, {})
              assert len(reps) == 1, (sample, reps)
              assert (reps[0].start, reps[0].end) == (0, len(sample)), (sample, reps[0].start, reps[0].end)
              assert reps[0].identifiers == ['23731077']
              assert not mp and not md and not manual

          grouped = [
              '(23731077, 12402102)', '[23731077; 12402102]',
              '(23731077, 12402102]', '[PMID 23731077, PMID 12402102}',
              '23731077, 12402102', '23731077; 12402102',
              'PMIDs: 23731077, 12402102'
          ]
          for sample in grouped:
              reps, mp, md, manual = m.find_replacements(sample, pmids, {})
              assert len(reps) == 1, (sample, reps)
              assert (reps[0].start, reps[0].end) == (0, len(sample)), (sample, reps[0].start, reps[0].end)
              assert reps[0].identifiers == ['23731077', '12402102']
              assert not mp and not md and not manual
          '@ | python -

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZoteroPMIDTool gui.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ZoteroPMIDTool-windows
          path: dist/ZoteroPMIDTool.exe
          if-no-files-found: error

      - name: Publish Windows release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.5 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.5 dist/ZoteroPMIDTool.exe --title "Zotero PMID Tool v1.0.5" --notes "Expands PMID placeholder handling to common bracket styles, mismatched brackets, PMID/PubMed labels, plural labels, and bare comma/semicolon PMID lists."
          }
