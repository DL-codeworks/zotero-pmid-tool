name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "build_exe.bat"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "*.py"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile pmid_docx_to_zotero.py gui.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZoteroPMIDTool gui.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ZoteroPMIDTool-windows
          path: dist/ZoteroPMIDTool.exe
          if-no-files-found: error
