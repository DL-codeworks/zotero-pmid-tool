name: Bootstrap source files

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Python sources
        shell: bash
        run: |
          cat .bootstrap/src.part* > /tmp/python-src.tgz.b64
          base64 -d /tmp/python-src.tgz.b64 > /tmp/python-src.tgz
          tar -xzf /tmp/python-src.tgz
          rm -rf .bootstrap .github/workflows/bootstrap-source.yml

      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Zotero PMID Tool source"
          git push
